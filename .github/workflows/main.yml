name: Deploy Design System Tokens to Github packages + Npm
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize # canary on new commit
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && !contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.title, 'ci skip') && !contains(github.event.pull_request.title, 'skip ci'))
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch all tags for ship-it

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'

      - name: Install dependencies
        run: npm ci

      - name: Validate package version
        run: |
          node -e '
            const { version } = require("./package.json");
            if (!require("semver").valid(version)) {
              console.error("::error::package.json must contain a valid release version before running Auto.");
              process.exit(1);
            }
          '

      - name: build
        run: npm run bundle

      - name: Configure git for Auto
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Publish with Auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install auto shipit